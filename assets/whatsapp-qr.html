<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="25">
    <title>ربط واتساب – الزمردة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: #022c22;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }

        .card {
            background: #fff;
            color: #064e3b;
            padding: 20px;
            border-radius: 18px;
            text-align: center;
            max-width: 260px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        h3 {
            margin: 0 0 10px;
            font-weight: 900;
            font-size: 16px;
        }

        .steps {
            font-size: 11px;
            color: #475569;
            margin-bottom: 12px;
            line-height: 1.6;
        }

        img {
            display: block;
            margin: 0 auto;
            width: 170px;
            height: 170px;
            border: 2px solid #059669;
            border-radius: 12px;
            padding: 6px;
            background: #fff;
        }

        .hint {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h3>📲 امسح رمز الواتساب</h3>
        <div class="steps">
            واتساب > الأجهزة المرتبطة > ربط جهاز
        </div>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=2%40ZlHb7%2BXQJ%2BKd82zt5J2cZN8YPC%2B3CwepKGrPQHFRtcSfFpsomFldziPGJHlIpPVP4KV8X8nKcX3do6w3FL82rD0zTRE7fwGS8Sg%3D%2CpQXZGB8bIGGy3qqQT7ohxWBJ5f7le8X7rLO%2Bo8suiHk%3D%2CSmS%2BZmBTKXe7eCrtNkTQMSFGaNJD0nlOZTbUJg31mgM%3D%2CqV9Dz8aDNZIRL3LRIfddcA6kZYmnR2XMb1iOPELkCi0%3D%2C1"
            alt="WhatsApp QR">
        <div class="hint">يتحدث الرمز تلقائياً كل 25 ثانية</div>
    </div>
</body>

</html>
