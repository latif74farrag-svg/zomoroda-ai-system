[project]
name = "ai-commander"
version = "0.1.0"
description = "Al Zomoroda Cosmetics - AI Commander Central Orchestration Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.3",
    "celery>=5.4.0",
    "redis>=5.1.0",
    "structlog>=24.4.0",
    "pandas>=2.2.3",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
observability = [
    "sentry-sdk[fastapi]>=2.14.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

