name: Encrypted commerce backup
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    env:
      NODE_ENV: production
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - run: npm run backup -- backups/commerce.encrypted.json
      - run: npm run restore:check -- backups/commerce.encrypted.json
      - uses: actions/upload-artifact@v4
        with:
          name: commerce-encrypted-${{ github.run_id }}
          path: backups/commerce.encrypted.json
          retention-days: 30
          if-no-files-found: error
